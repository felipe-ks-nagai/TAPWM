<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="main.js"></script>
</head>
<body>
    <form name="form" onsubmit="validar()">
        <input type="text" name="nome" placeholder="Nome" minlength="10" required>
        <input type="email" name="email" placeholder="Email">
        <input type="text" name="commento" placeholder="Comentario" minlength="20" required>
        <h3>Pesquisa:</h3>
        <p>Primeira vez nesta pagina?</p>
        <input type="radio" name="primeira_vez" value="sim">
        <label for="sim">Sim</label>
        <input type="radio" name="primeira_vez" value="nao">
        <label for="nao">Não</label>

        <button type="submit">Enviar</button>
        <button type="reset">Limpar</button>
    </form>
</body>
</html>
